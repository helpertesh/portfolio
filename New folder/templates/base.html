<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ p.name }} | {{ p.title }}</title>
    <meta name="description" content="{{ p.name }} ({{ p.nickname }}) is a {{ p.title|lower }} in {{ p.location }}, building fast, responsive websites and web apps.">
    <meta name="theme-color" content="#0b1120">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ p.name }} | {{ p.title }}">
    <meta property="og:description" content="{{ p.tagline }}">
    <meta property="og:image" content="{{ media(p.about_image) }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b82f6'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='32' fill='white' text-anchor='middle'%3E{{ p.initials }}%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "{{ p.name }}",
      "alternateName": "{{ p.nickname }}",
      "jobTitle": "{{ p.title }}",
      "email": "mailto:{{ p.email }}",
      "telephone": "{{ p.phone|replace(' ', '') }}",
      "address": { "@type": "PostalAddress", "addressLocality": "{{ p.location.split(',')[0] }}", "addressCountry": "KE" },
      "sameAs": [{% for k, url in p.social.items() %}"{{ url }}"{% if not loop.last %}, {% endif %}{% endfor %}]
    }
    </script>
</head>
<body>

    <header class="site-header" id="top">
        <div class="container nav">
            <a href="#top" class="logo"><span class="logo-mark">{{ p.initials }}</span>{{ p.name }}</a>
            <div class="nav-right">
                <ul class="nav-links" id="navLinks">
                    <li><a href="#about">About</a></li>
                    <li><a href="#stack">Stack</a></li>
                    <li><a href="#services">Services</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#journey">Journey</a></li>
                    <li><a href="#contact">Contact</a></li>
                    <li><a href="#contact" class="btn btn-primary btn-sm nav-cta">Hire me</a></li>
                </ul>
                <button type="button" class="icon-btn" id="themeToggle" aria-label="Switch to light theme" title="Toggle theme"><i class="fas fa-sun"></i></button>
                <button type="button" class="icon-btn nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; <span id="year"></span> {{ p.name }}. Designed and built by me.</p>
            <div class="footer-links">
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
                <a href="{{ p.social.github }}" target="_blank" rel="noopener">GitHub</a>
            </div>
        </div>
    </footer>

    {% if p.whatsapp %}<a class="wa-float" href="{{ wa_link }}" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><i class="fab fa-whatsapp"></i><span>Chat on WhatsApp</span></a>{% endif %}
    <button class="to-top" id="toTop" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
